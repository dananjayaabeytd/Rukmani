[project]
name = "kapruka-agent"
version = "0.1.0"
description = "Rukmani — an AI gift concierge for Kapruka, built on the Kapruka MCP"
authors = [{ name = "dananjayaabeytd", email = "dananjayaabeytd@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "loguru>=0.7.3",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sentry-sdk[fastapi]>=2.73.0",
    "sse-starlette>=3.5.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

# ── Tool configuration ─────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
