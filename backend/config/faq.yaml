        - 🧾 **Koko හෝ MintPay** (වාරික වලින්) — රු. 1,000ට වැඩි order වලට
        - 🏦 **Online bank transfer**
        - 💵 **Cash on delivery** ගොඩක් order වලට — restaurant/frozen food සහ peak දවස් වලට නැහැ

        මෙතන order එක confirm කළාම මම **ආරක්ෂිත Kapruka ගෙවීම් link එකක්** දෙනවා. ගෙවීම් ගැන ප්‍රශ්න නම් **+94 117 551 111** (පැය 24).
      ta: |
        Kapruka-வில் இவ்வாறு செலுத்தலாம்:
        - 💳 **அட்டைகள்:** Visa, Mastercard மற்றும் Amex
        - 🧾 **Koko அல்லது MintPay** (தவணைகளாக) — ரூ. 1,000 முதல் ஆர்டர்களுக்கு
        - 🏦 **Online bank transfer**
        - 💵 **Cash on delivery** பெரும்பாலான ஆர்டர்களுக்கு — restaurant/frozen food மற்றும் peak நாட்களில் இல்லை

        இங்கே ஆர்டரை confirm செய்ததும் **பாதுகாப்பான Kapruka கட்டண link** தருகிறேன். கட்டணம் பற்றி கேள்வியா? **+94 117 551 111** (24 மணி நேரம்).

  - id: refund
    examples:
      - what is your refund policy
      - refund policy
      - return policy
      - can i return an item
      - how do i return an item
      - how do i get a refund
      - i want a refund
      - i want to return my order
      - my item arrived damaged
    answers:
      en: |
        Kapruka offers easy returns for genuine reasons (faulty, damaged or not as described). "Change of mind" isn't accepted. Time to contact Kapruka:
        - **General items:** within 15 days of purchase
        - **Electronics and clothing:** within 7 days
        - **Global Shop:** within 24 hours of delivery

        Refunds go back to your original payment method. Contact **+94 117 551 111**, WhatsApp **070 285 5000** or **info@kapruka.com**.
        Full policy: https://www.kapruka.com/shop/returns-refunds-and-other-policies-of-kapruka
      si: |
        සාධාරණ හේතුවක් තියෙනවා නම් (දෝෂ සහිත, හානි වූ, හෝ විස්තරයට නොගැළපෙන) Kapruka පහසුවෙන් return කරනවා. "හිත වෙනස් වුණා" කියන එක පිළිගන්නේ නැහැ. Kapruka අමතන්න ඕනේ:
        - **සාමාන්‍ය භාණ්ඩ:** මිලදී ගෙන දින 15ක් ඇතුළත
        - **Electronics සහ ඇඳුම්:** දින 7ක් ඇතුළත
        - **Global Shop:** ලැබී පැය 24ක් ඇතුළත

        Refund එක ගෙවපු ක්‍රමයටම ලැබෙනවා. අමතන්න **+94 117 551 111**, WhatsApp **070 285 5000** හෝ **info@kapruka.com**.
        සම්පූර්ණ ප්‍රතිපත්තිය: https://www.kapruka.com/shop/returns-refunds-and-other-policies-of-kapruka
      ta: |
        சரியான காரணம் இருந்தால் (பழுது, சேதம், அல்லது விவரத்துடன் பொருந்தாதது) Kapruka எளிதாக return செய்யும். "மனம் மாறியது" ஏற்றுக்கொள்ளப்படாது. Kapruka-வை தொடர்பு கொள்ள வேண்டிய காலம்:
        - **பொதுப் பொருட்கள்:** வாங்கி 15 நாட்களுக்குள்
        - **Electronics மற்றும் ஆடைகள்:** 7 நாட்களுக்குள்
        - **Global Shop:** கிடைத்து 24 மணி நேரத்துக்குள்

        Refund நீங்கள் செலுத்திய முறைக்கே திரும்ப வரும். தொடர்புக்கு **+94 117 551 111**, WhatsApp **070 285 5000** அல்லது **info@kapruka.com**.
        முழுக் கொள்கை: https://www.kapruka.com/shop/returns-refunds-and-other-policies-of-kapruka

  - id: cancel_order
    examples:
      - can i cancel my order
      - how do i cancel my order
      - i want to cancel my order
      - cancel my order
    answers:
      en: |
        A placed order can be cancelled only **before Kapruka starts processing it**. After that, Kapruka may refuse or give a partial refund.
        To cancel, contact Kapruka quickly on **+94 117 551 111** (24/7) with your 12-digit order number.

        (If you haven't paid yet, you can also just leave the payment link — or tell me what to change.)
      si: |
        Order එකක් cancel කරන්න පුළුවන් **Kapruka එක process කරන්න පටන් ගන්න කලින් විතරයි**. ඊට පස්සේ cancel කිරීම ප්‍රතික්ෂේප කරන්න හෝ කොටසක් විතරක් refund කරන්න පුළුවන්.
        Cancel කරන්න ඉක්මනින් **+94 117 551 111** (පැය 24) අමතන්න, ඉලක්කම් 12ක order අංකයත් එක්ක.

        (තාම ගෙව්වේ නැත්නම්, payment link එක අත්හරින්නත් පුළුවන් — නැත්නම් මොනවද වෙනස් කරන්න ඕනේ කියන්න.)
      ta: |
        ஆர்டரை **Kapruka process செய்யத் தொடங்கும் முன் மட்டுமே** cancel செய்ய முடியும். அதன் பிறகு Kapruka மறுக்கலாம் அல்லது பகுதி refund மட்டும் தரலாம்.
        Cancel செய்ய உடனே **+94 117 551 111** (24 மணி நேரம்) அழைக்கவும், உங்கள் 12 இலக்க ஆர்டர் எண்ணுடன்.

        (இன்னும் பணம் செலுத்தவில்லை என்றால், payment link-ஐ விட்டுவிடலாம் — அல்லது என்ன மாற்ற வேண்டும் என்று சொல்லுங்கள்.)

  - id: sunday_delivery
    examples:
      - do you deliver on sundays
      - do you deliver on sunday
      - sunday delivery
      - can you deliver on sunday
    answers:
      en: Yes, Kapruka delivers on Sundays too 🚚 Availability depends on the item and the city — tell me both, and I'll check the exact date for you.
      si: ඔව්, Kapruka ඉරිදා දිනවලත් delivery කරනවා 🚚 ඒක භාණ්ඩය සහ නගරය අනුව වෙනස් වෙනවා — දෙකම කියන්න, හරියටම දිනය බලලා කියන්නම්.
      ta: ஆம், Kapruka ஞாயிற்றுக்கிழமைகளிலும் டெலிவரி செய்கிறது 🚚 இது பொருள் மற்றும் ஊரைப் பொறுத்தது — இரண்டையும் சொல்லுங்கள், சரியான தேதியைச் சரிபார்க்கிறேன்.
