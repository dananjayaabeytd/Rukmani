        I'm Rukmani, Kapruka's AI gift concierge. I can:
        - find gifts and products from Kapruka's live catalogue,
        - check delivery to any city in Sri Lanka, and to 9 countries abroad,
        - build your cart, write the gift card message and set up the order,
        - track an order you've placed.

        What are you shopping for today?
