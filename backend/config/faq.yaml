# Instant answers to common questions — no model call, no cost, instant reply.
#
# How it's used (src/kapruka_agent/faq.py):
#   - Only SHORT messages (10 words or fewer) are looked up.
#   - A message must closely match one of an entry's `examples` (typos are OK).
#     "hi" matches; "hi, I need a cake for Kandy tomorrow" does not, so real
#     requests always reach Rukmani.
#   - The answer is picked in the customer's language: en, si (Sinhala), ta
#     (Tamil), singlish, tanglish. If the entry has no answer in that language,
#     Rukmani answers instead.
#
# Facts come from kapruka.com (Office Locations, Order Tracking, International
# Gifts, Same Day Delivery pages). Keep them in sync if Kapruka changes them.
# Never put a policy here that isn't on Kapruka's site — send people to the
# hotline instead.

faq:
  - id: greeting
    examples:
      - hi
      - hii
      - hello
      - helo
      - hey
      - hey there
      - hi there
      - good morning
      - good afternoon
      - good evening
      - ayubowan
      - ආයුබෝවන්
      - හායි
      - හෙලෝ
      - vanakkam
      - வணக்கம்
      - hello rukmani
      - hi rukmani
    answers:
      en: |
        Hi! I'm Rukmani, Kapruka's gift concierge 🎁
        Tell me who it's for and the occasion, and I'll find great options, check delivery to their city and set up the order.
      si: |
        ආයුබෝවන්! මම රුක්මණී, Kapruka එකේ තෑගි සහායිකාව 🎁
        කාටද, මොන අවස්ථාවටද කියන්න — හොඳම තෑගි හොයලා, ඒ නගරයට delivery බලලා, order එක ලෑස්ති කරලා දෙන්නම්.
      ta: |
        வணக்கம்! நான் ருக்மணி, Kapruka-வின் பரிசு உதவியாளர் 🎁
        யாருக்கு, எந்த நிகழ்வுக்கு என்று சொல்லுங்கள் — சிறந்த பரிசுகளைத் தேடி, அவர்கள் ஊருக்கு டெலிவரியைச் சரிபார்த்து, ஆர்டரைத் தயார் செய்கிறேன்.
      singlish: |
        Ayubowan! Mama Rukmani, Kapruka eke gift helper 🎁
        Kaatada, mona occasion ekatada kiyanna — hondama options hoyala, delivery check karala, order eka ready karala dennam.
      tanglish: |
        Vanakkam! Naan Rukmani, Kapruka-oda gift helper 🎁
        Yaarukku, endha occasion-ku nu sollunga — nalla gifts thedi, delivery check panni, order ready pannuren.

  - id: who_are_you
    examples:
