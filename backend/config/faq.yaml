    answers:
      en: The delivery fee depends on the **city, the date and the items**. Tell me where it's going (and what you'd like to send), and I'll check the exact fee.
      si: Delivery ගාස්තුව **නගරය, දිනය සහ භාණ්ඩ** අනුව වෙනස් වෙනවා. කොහෙටද යවන්නේ (සහ මොනවද) කියන්න, හරියටම ගාස්තුව බලලා කියන්නම්.
      ta: டெலிவரி கட்டணம் **ஊர், தேதி மற்றும் பொருட்களைப்** பொறுத்தது. எங்கே அனுப்ப வேண்டும் (என்ன அனுப்ப வேண்டும்) என்று சொல்லுங்கள், சரியான கட்டணத்தைச் சரிபார்க்கிறேன்.

  - id: payment
    examples:
