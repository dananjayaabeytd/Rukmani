        Hi! I'm Rukmani, Kapruka's gift concierge 🎁
        Tell me who it's for and the occasion, and I'll find great options, check delivery to their city and set up the order.
      si: |
        ආයුබෝවන්! මම රුක්මණී, Kapruka එකේ තෑගි සහායිකාව 🎁
        කාටද, මොන අවස්ථාවටද කියන්න — හොඳම තෑගි හොයලා, ඒ නගරයට delivery බලලා, order එක ලෑස්ති කරලා දෙන්නම්.
      ta: |
