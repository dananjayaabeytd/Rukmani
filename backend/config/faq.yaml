        யாருக்கு, எந்த நிகழ்வுக்கு என்று சொல்லுங்கள் — சிறந்த பரிசுகளைத் தேடி, அவர்கள் ஊருக்கு டெலிவரியைச் சரிபார்த்து, ஆர்டரைத் தயார் செய்கிறேன்.
