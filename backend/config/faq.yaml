# Instant answers to common questions — no model call, no cost, instant reply.
#
# How it's used (src/kapruka_agent/faq.py):
#   - Only SHORT messages (10 words or fewer) are looked up.
#   - A message must closely match one of an entry's `examples` (typos are OK).
#     "hi" matches; "hi, I need a cake for Kandy tomorrow" does not, so real
#     requests always reach Rukmani.
#   - The answer is picked in the customer's language: en, si (Sinhala), ta
#     (Tamil), singlish, tanglish. If the entry has no answer in that language,
#     Rukmani answers instead.
#
# Facts come from kapruka.com (Office Locations, Order Tracking, International
# Gifts, Same Day Delivery, and the Returns/Refunds policy page) and from
# Kapruka's own assistant Aloka (payment methods, Sunday delivery), checked
# October 2026. Keep them in sync if Kapruka changes them.
# Never put a policy here that isn't on Kapruka's site — send people to the
# hotline instead.

faq:
  - id: greeting
    examples:
      - hi
      - hii
      - hello
      - helo
      - hey
      - hey there
      - hi there
      - good morning
      - good afternoon
      - good evening
      - ayubowan
      - ආයුබෝවන්
      - හායි
      - හෙලෝ
