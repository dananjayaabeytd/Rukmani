    answers:
      en: |
        Kapruka accepts:
        - 💳 **Cards:** Visa, Mastercard and Amex
        - 🧾 **Koko or MintPay** (pay in instalments) on orders from LKR 1,000
        - 🏦 **Online bank transfer**
        - 💵 **Cash on delivery** on most orders — not for restaurant or frozen food, or on peak days

        When you confirm an order here, I give you a **secure Kapruka payment link** to pay. Questions about paying? Call **+94 117 551 111** (24/7).
      si: |
        Kapruka එකේ ගෙවන්න පුළුවන්:
