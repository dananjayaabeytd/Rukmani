        Yes — for many items, if you **order before 12 PM** it can be delivered the same day, island-wide 🚚
        Tell me the item and the city, and I'll check the exact date and fee for you.
      si: |
        ඔව් — ගොඩක් භාණ්ඩ **දවල් 12ට කලින් order කළොත්** එදිනම, දිවයින පුරා delivery කරන්න පුළුවන් 🚚
        භාණ්ඩය සහ නගරය කියන්න, හරියටම දිනය සහ ගාස්තුව බලලා කියන්නම්.
      ta: |
        ஆம் — பல பொருட்களுக்கு **மதியம் 12 மணிக்கு முன் ஆர்டர் செய்தால்** அதே நாளில், இலங்கை முழுவதும் டெலிவரி செய்யலாம் 🚚
        பொருளையும் ஊரையும் சொல்லுங்கள், சரியான தேதியையும் கட்டணத்தையும் சரிபார்க்கிறேன்.

  - id: delivery_fee
    examples:
