        - cart එක හදලා, තෑගි කාඩ් පණිවිඩය ලියලා, order එක ලෑස්ති කරන්න,
        - ඔබේ order එක track කරන්න.

        අද මොනවද හොයන්නේ?
      ta: |
        நான் ருக்மணி, Kapruka-வின் AI பரிசு உதவியாளர். என்னால்:
        - Kapruka-வில் பரிசுகளையும் பொருட்களையும் தேட முடியும்,
        - இலங்கையின் எந்த ஊருக்கும், வெளிநாட்டில் 9 நாடுகளுக்கும் டெலிவரியைச் சரிபார்க்க முடியும்,
        - cart-ஐ உருவாக்கி, பரிசு அட்டை செய்தியை எழுதி, ஆர்டரைத் தயார் செய்ய முடியும்,
        - உங்கள் ஆர்டரை track செய்ய முடியும்.

        இன்று என்ன தேடுகிறீர்கள்?

