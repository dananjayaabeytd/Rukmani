        கேக், மலர்கள், சாக்லேட் மற்றும் hampers ஒவ்வொரு நாட்டிலும் Kapruka partner மூலம் வழங்கப்படும் — முக்கிய நகரங்களில் பொதுவாக 1–3 வேலை நாட்களில். நீங்கள் இங்கேயே ரூபாயில் செலுத்தலாம்.

