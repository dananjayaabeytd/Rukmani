      - which countries do you deliver to
    answers:
      en: |
        Yes! Kapruka sends gifts to **9 countries**: USA, Canada, UK, Australia, UAE, France, New Zealand, Italy and India 🌍
        Cakes, flowers, chocolates and hampers are delivered by Kapruka's local partner in each country, usually in 1–3 working days in the main cities. You pay here in rupees.

        Which country should it go to?
      si: |
        ඔව්! Kapruka රටවල් **9කට** තෑගි යවනවා: USA, Canada, UK, Australia, UAE, France, New Zealand, Italy සහ India 🌍
        කේක්, මල්, චොකලට් සහ hampers ඒ ඒ රටේ Kapruka partner කෙනෙක් ගෙනත් දෙනවා — ප්‍රධාන නගරවලට සාමාන්‍යයෙන් වැඩ කරන දින 1–3කින්. ගෙවන්නේ මෙහෙන්ම රුපියල් වලින්.

        කොයි රටටද යවන්න ඕනේ?
      ta: |
        ஆம்! Kapruka **9 நாடுகளுக்கு** பரிசுகளை அனுப்புகிறது: USA, Canada, UK, Australia, UAE, France, New Zealand, Italy மற்றும் India 🌍
        கேக், மலர்கள், சாக்லேட் மற்றும் hampers ஒவ்வொரு நாட்டிலும் Kapruka partner மூலம் வழங்கப்படும் — முக்கிய நகரங்களில் பொதுவாக 1–3 வேலை நாட்களில். நீங்கள் இங்கேயே ரூபாயில் செலுத்தலாம்.

        எந்த நாட்டுக்கு அனுப்ப வேண்டும்?

  - id: same_day
    examples:
