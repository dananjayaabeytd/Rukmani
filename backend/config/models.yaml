# ────────────────────────────────────────────────────────────────────
# Model profiles
#
# Each profile has two roles, each a primary model plus fallbacks tried in
# order if the primary fails (outage, rate limit, no credit). Every fallback
# is logged as a warning, so a broken primary never hides.
#
#   chat     Rukmani herself: talks to customers and calls tools.
#   utility  Cheap background work: remembering facts, summarising long chats.
#
# Switch profile with `active_profile` below, or MODEL_PROFILE=<name> in the
# environment (on Cloud Run: model_profile in infra/terraform.tfvars).
#
# Each model entry:
#   provider  openai | groq          (needs OPENAI_API_KEY / GROQ_API_KEY)
#   model     the provider's model id
#   params    optional extra settings passed to the model, e.g.
#             reasoning_effort   reasoning models only: low | medium | high
#             use_responses_api  OpenAI only. REQUIRED for OpenAI reasoning
#                                models (gpt-5.x) that use tools: the older
#                                chat endpoint rejects tools + reasoning_effort.
# ────────────────────────────────────────────────────────────────────

active_profile: budget

profiles:
  # Cheapest reliable setup, while credits are low. Expect weaker
  # Sinhala/Tamil than "balanced". (Groq gpt-oss-20b as primary sometimes
  # answered without searching and invented products, so it's only a fallback.)
  budget:
    chat:
      primary:
        provider: openai
        model: gpt-5.4-nano
        params: { reasoning_effort: low, use_responses_api: true }
      fallbacks:
        - provider: groq
          model: openai/gpt-oss-20b
          params: { reasoning_effort: low }
    utility:
      primary:
        provider: openai
        model: gpt-5.4-nano
        params: { reasoning_effort: low, use_responses_api: true }
      fallbacks:
        - provider: groq
          model: openai/gpt-oss-20b
          params: { reasoning_effort: low }

  # Good quality for a sensible price. Use for real testing and demos.
  balanced:
    chat:
      primary:
        provider: openai
        model: gpt-5.4-mini
        params: { reasoning_effort: low, use_responses_api: true }
      fallbacks:
        - provider: groq
          model: openai/gpt-oss-120b
          params: { reasoning_effort: low }
    utility:
      primary:
        provider: openai
        model: gpt-5.4-nano
        params: { reasoning_effort: low, use_responses_api: true }
      fallbacks:
        - provider: groq
          model: openai/gpt-oss-20b
          params: { reasoning_effort: low }

  # Best Sinhala, Tamil and reasoning. Use for judging day.
  best:
    chat:
      primary:
        provider: openai
        model: gpt-5.5
        params: { reasoning_effort: low, use_responses_api: true }
      fallbacks:
        - provider: openai
          model: gpt-5.4-mini
          params: { reasoning_effort: low, use_responses_api: true }
        - provider: groq
          model: openai/gpt-oss-120b
    utility:
      primary:
        provider: openai
        model: gpt-5.4-mini
        params: { reasoning_effort: low, use_responses_api: true }
      fallbacks:
        - provider: groq
          model: openai/gpt-oss-120b
          params: { reasoning_effort: low }
