# ────────────────────────────────────────────────────────────────────
# Model profiles
#
# A profile says which chat model Rukmani uses, plus fallbacks that are
# tried in order if the primary model fails (outage, rate limit, no credit).
#
# Switch profile by changing `active_profile` below, or without touching
# this file by setting MODEL_PROFILE=<name> in backend/.env.
#
# Each model entry:
#   provider  openai | groq          (needs OPENAI_API_KEY / GROQ_API_KEY)
#   model     the provider's model id
#   params    optional extra settings passed to the model, e.g.
#             reasoning_effort (reasoning models only: low | medium | high)
#
# A model whose API key is missing is skipped, so a profile still works
# with only one of the two keys.
# ────────────────────────────────────────────────────────────────────

active_profile: budget

profiles:
  # Cheapest working setup, for development while credits are low.
  # Expect weaker Sinhala and occasional mistakes in tool use.
  budget:
    primary:
      provider: groq
      model: openai/gpt-oss-20b
      params:
        reasoning_effort: low
    fallbacks:
      - provider: openai
        model: gpt-4.1-nano

  # Good quality for a sensible price. Use for real testing and demos.
  balanced:
    primary:
      provider: openai
      model: gpt-5.4-mini
      params:
        reasoning_effort: low
    fallbacks:
      - provider: groq
        model: openai/gpt-oss-120b
        params:
          reasoning_effort: low

  # Best Sinhala and reasoning. Use for judging day.
  best:
    primary:
      provider: openai
      model: gpt-5.5
      params:
        reasoning_effort: low
    fallbacks:
      - provider: openai
        model: gpt-5.4-mini
        params:
          reasoning_effort: low
      - provider: groq
        model: openai/gpt-oss-120b
