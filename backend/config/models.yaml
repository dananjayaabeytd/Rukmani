# ────────────────────────────────────────────────────────────────────
# Model profiles
#
# A profile says which chat model Rukmani uses, plus fallbacks that are
# tried in order if the primary model fails (outage, rate limit, no credit).
# Every fallback is logged as a warning, so a broken primary never hides.
#
# Switch profile by changing `active_profile` below, or without touching
# this file by setting MODEL_PROFILE=<name> in backend/.env.
#
# Each model entry:
#   provider  openai | groq          (needs OPENAI_API_KEY / GROQ_API_KEY)
#   model     the provider's model id
#   params    optional extra settings passed to the model, e.g.
#             reasoning_effort   reasoning models only: low | medium | high
#             use_responses_api  OpenAI only. REQUIRED for OpenAI reasoning
#                                models (gpt-5.x) that use tools: the older
#                                chat endpoint rejects tools + reasoning_effort.
#
# A model whose API key is missing is skipped, so a profile still works
# with only one of the two keys.
# ────────────────────────────────────────────────────────────────────

active_profile: budget

profiles:
  # Cheapest reliable setup, while credits are low. Expect weaker
  # Sinhala/Tamil than "balanced". (Groq gpt-oss-20b as primary sometimes
  # answered without searching and invented products, so it's only a fallback.)
  budget:
    primary:
      provider: openai
      model: gpt-5.4-nano
      params:
        reasoning_effort: low
        use_responses_api: true
    fallbacks:
      - provider: groq
        model: openai/gpt-oss-20b
        params:
          reasoning_effort: low

  # Good quality for a sensible price. Use for real testing and demos.
  balanced:
    primary:
      provider: openai
      model: gpt-5.4-mini
      params:
        reasoning_effort: low
        use_responses_api: true
    fallbacks:
      - provider: groq
        model: openai/gpt-oss-120b
        params:
          reasoning_effort: low

  # Best Sinhala, Tamil and reasoning. Use for judging day.
  best:
    primary:
      provider: openai
      model: gpt-5.5
      params:
        reasoning_effort: low
        use_responses_api: true
    fallbacks:
      - provider: openai
        model: gpt-5.4-mini
        params:
          reasoning_effort: low
          use_responses_api: true
      - provider: groq
        model: openai/gpt-oss-120b
