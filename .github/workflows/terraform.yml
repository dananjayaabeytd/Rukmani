# Infrastructure changes (infra/**):
#   pull request  → terraform plan, shown in the run's summary for review
#   push to main  → terraform apply (in the "production" environment, where
#                   you can require a manual approval in GitHub settings)

name: Terraform

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for a token to log in to Google

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/240930203956/locations/global/workloadIdentityPools/github/providers/github-actions
  TERRAFORM_SA: github-terraform@rukmani-512609.iam.gserviceaccount.com
  VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform init -input=false
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt
          { echo '## Terraform plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Never run at the same time as a backend deploy on the same service.
    concurrency: rukmani-gcp
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m
